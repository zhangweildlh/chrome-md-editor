name: Desktop Build (Tauri EXE)

permissions:
  contents: write

# 远端编译：不依赖本地安装任何程序。
# 推送任意分支 / 打 v* 标签 / 开 PR / 手动触发 → 在 GitHub windows-latest 云端
# 用 Rust + Tauri 把同一套 Web 源码（src/）打包成 Windows EXE（nsis/msi）。
# 本仓库的 Web 源码演进（src/ 任何改动）会自动随下一次构建进入 EXE。
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows EXE (remote)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./desktop -> target"

      - name: Install web deps (root)
        run: npm ci

      - name: Generate Windows icon
        run: node desktop/scripts/make-ico.mjs

      - name: Build desktop (Tauri)
        working-directory: desktop
        run: |
          npm install
          npm run tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: markdown-editor-windows
          path: |
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
