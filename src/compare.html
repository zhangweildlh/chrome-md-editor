<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown 对比合并</title>
    <!-- 复用 editor.css 的主题变量（--bg/--fg/--accent/--border 等），不新建变量 -->
    <link rel="stylesheet" href="./editor.css" />
    <link rel="stylesheet" href="./compare.css" />
  </head>
  <body>
    <!-- 顶部工具栏（按钮为占位，实际行为由 T2/T3/T4/T4b/T5/T6 Agent 绑定） -->
    <header class="toolbar compare-toolbar" id="compareToolbar">
      <div class="toolbar-left">
        <span class="logo-text">MD Compare</span>
        <span class="app-version" id="compareVersion" title="扩展版本">v1.5.0</span>
      </div>

      <div class="toolbar-center">
        <!-- 视图切换：两栏 / 三栏 / 单栏 unified -->
        <div class="toolbar-group compare-view-group">
          <button class="compare-toolbar-btn" id="btnViewTwo" data-mode="two" title="两栏对照（Yours / Theirs）">两栏</button>
          <button class="compare-toolbar-btn" id="btnViewThree" data-mode="three" title="三栏合并（Yours / Result / Theirs）">三栏</button>
          <button class="compare-toolbar-btn" id="btnViewSingle" data-mode="single" title="单栏 unified 内联对照">单栏</button>
        </div>

        <div class="toolbar-divider"></div>

        <!-- 块导航（B 增量：上一块 / 下一块） -->
        <div class="toolbar-group">
          <button class="compare-toolbar-btn" id="btnPrevChunk" title="跳到上一块 (Shift+B 或 [，编辑区内用 Alt+Shift+B)">← 上一块</button>
          <button class="compare-toolbar-btn" id="btnNextChunk" title="跳到下一块 (B 或 ]，编辑区内用 Alt+B)">下一块 →</button>
          <button class="compare-toolbar-btn" id="btnToggleCollapse" title="展开/折叠未改区域 (E)">展开未改</button>
          <button class="compare-toolbar-btn" id="btnAcceptTheirs" title="接受光标所在 Theirs 块到结果 (T4)">接受 Theirs 块</button>
        </div>

        <div class="toolbar-divider"></div>

        <!-- 文件 / 导出 -->
        <div class="toolbar-group">
          <button class="compare-toolbar-btn" id="btnPickFiles" title="选择要对比的文件">选择文件</button>
          <button class="compare-toolbar-btn" id="btnExportResult" title="导出合并结果 (T6)">导出结果</button>
          <button class="compare-toolbar-btn" id="btnExportDiff" title="导出 diff 报告 (F)">导出 diff</button>
        </div>
      </div>

      <div class="toolbar-right">
        <!-- 图片拖拽入口（T5） -->
        <button class="compare-toolbar-btn" id="btnAddImages" title="添加图片插入当前块 (T5)">图片</button>
      </div>
    </header>

    <main class="compare-main" id="compareRoot">
      <!-- 文件选择区：A=Yours, B=Theirs（单栏模式复用 A 作为 original） -->
      <section class="compare-files" id="compareFiles">
        <div class="compare-file-slot" id="fileSlotA" data-slot="a">
          <span class="compare-file-name">Yours（未选择）</span>
        </div>
        <div class="compare-file-slot" id="fileSlotB" data-slot="b">
          <span class="compare-file-name">Theirs（未选择）</span>
        </div>
      </section>

      <!-- 图片拖拽区（T5 实现真实拖拽；此处为占位） -->
      <section class="compare-image-drop" id="compareImageDrop">
        将图片拖拽到此处，或点击「图片」按钮选择（T5 实现）
      </section>

      <!-- 三个视图容器：由 UI-A Agent 在 T2/T4/T4b 初始化挂载内容 -->
      <section class="compare-views" id="compareViews">
        <div class="compare-view compare-view-two" id="viewTwo" hidden></div>
        <div class="compare-view compare-view-three" id="viewThree" hidden></div>
        <div class="compare-view compare-view-single" id="viewSingle" hidden></div>
      </section>
    </main>

    <script type="module" src="./compare.js"></script>
  </body>
</html>
