[package]
name = "chrome-md-editor-desktop"
version = "1.4.15"
description = "Markdown Editor desktop shell (Tauri)"
authors = ["zhangweildlh"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "chrome_md_editor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# 调试桥 feature：默认不启用。需排查 EXE 侧 BUG 时显式开启：
#   cargo build --features debug-bridge
# 且运行时仍需环境变量 CME_DEBUG=1 才会真正启动 127.0.0.1:9555 端口与 %temp% 落盘。
[features]
debug-bridge = []
